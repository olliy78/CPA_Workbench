version: '3.8'

services:
  cpa-builder:
    image: cpa-workbench-build
    container_name: cpa-workbench-builder
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        USERNAME: builder
    volumes:
      - .:/workspace
    working_dir: /workspace
    hostname: cpa-builder
    stdin_open: true
    tty: true
    command: tail -f /dev/null
    
    # Optional: Netzwerk-Konfiguration
    # ports:
    #   - "8080:8080"  # Falls ein Webserver o.ä. im Container läuft
    
    # Optional: Umgebungsvariablen
    environment:
      - WINEARCH=win32
      - DISPLAY=${DISPLAY:-:0}
      
    # Optional: Zugriff auf X11 für GUI-Anwendungen
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix:rw
    #   - ${HOME}/.Xauthority:/home/builder/.Xauthority:rw
